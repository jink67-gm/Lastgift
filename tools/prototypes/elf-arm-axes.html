<!doctype html><meta charset="utf-8"><title>요정 팔 축 확인</title>
<body style="margin:0;background:#223049">
<script type="module">
// 미니 요정 팔 뼈(UpperArm/LowerArm)를 어느 축으로 돌려야 앞으로·위로 드는지 확인한다(들기·운반 자세용).
import * as THREE from '/@fs/home/user/lastgift/node_modules/three/build/three.module.js';
import { Models } from '/src/scene/models.ts';
import { createMiniElf } from '/src/scene/miniElf.ts';
import { ELF_LOOKS } from '/src/data/elves.ts';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(1200, 420); document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color('#2a3550');
s.add(new THREE.HemisphereLight('#c8d6f0', '#98a6c2', 1.6)); const d = new THREE.DirectionalLight('#fff', 2); d.position.set(3, 6, 5); s.add(d);
const models = await Models.load(['elf']);
const cases = [['기본', null], ['X+', 'x', 1.5], ['X-', 'x', -1.5], ['Z+', 'z', 1.5], ['Z-', 'z', -1.5], ['Y+', 'y', 1.5]];
const side = new URLSearchParams(location.search).has('side');
const elves = [];
cases.forEach(([name, ax, a], i) => {
  const e = createMiniElf(models, ELF_LOOKS[i % 2]);
  e.root.position.x = (i - 2.5) * 1.1;
  e.root.rotation.y = side ? Math.PI / 2 : 0.6; // 옆(+x를 본다) 또는 비스듬히 앞
  s.add(e.root);
  elves.push([e, ax, a]);
});
const c = new THREE.OrthographicCamera(-3.6, 3.6, 1.3, -0.2, 0.1, 50); c.position.set(0, 1.0, 10); c.lookAt(0, 0.6, 0);
let t = 0;
for (let k = 0; k < 10; k++) {
  t += 0.05;
  for (const [e, ax, a] of elves) {
    e.animate(t, false);
    if (!ax) continue;
    e.root.traverse((o) => { if (/^UpperArm/.test(o.name)) { const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(ax === 'x' ? 1 : 0, ax === 'y' ? 1 : 0, ax === 'z' ? 1 : 0), o.name.endsWith('R') && ax !== 'x' ? -a : a); o.quaternion.multiply(q); } });
  }
}
r.render(s, c); window.done = true;
</script>
